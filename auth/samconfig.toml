# SAM CLI configuration for the OAuth bridge stack. Holds no IDs or secrets;
# the ChatGPT callback id is passed at deploy time via --parameter-overrides.
version = 0.1

[default.global.parameters]
stack_name = "mcp-auth"
region = "us-west-2"

[default.build.parameters]
cached = false

[default.deploy.parameters]
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
