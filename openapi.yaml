openapi: 3.1.0
info:
  title: audiofile-api
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.com
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check health
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /tracks/uploads:
    post:
      operationId: createTrackUpload
      summary: Start a track upload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ filename, size_bytes ]
              properties:
                filename:
                  type: string
                  example: song.mp3
                size_bytes:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 52428800
                content_sha256:
                  type: string
                content_type:
                  type: string
                  enum: [ audio/mpeg ]
      responses:
        "201":
          description: The track was created; PUT the file to upload_url.
          content:
            application/json:
              schema:
                type: object
                properties:
                  track_id:
                    type: string
                  upload_url:
                    type: string
                  upload_method:
                    type: string
                    enum: [ PUT ]
                  upload_headers:
                    type: object
                    additionalProperties:
                      type: string
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tracks:
    get:
      operationId: listTracks
      summary: List tracks
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of tracks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Track"
                  next_cursor:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tracks/{id}:
    get:
      operationId: getTrack
      summary: Get a track
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: The track.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTrack
      summary: Update a track
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/trackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                artist:
                  type: string
                  minLength: 1
                album:
                  type: string
                genre:
                  type: string
                year:
                  type: integer
                  minimum: 0
                lyrics:
                  type: string
                bpm:
                  type: number
                  minimum: 20
                  maximum: 300
      responses:
        "200":
          description: The updated track.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTrack
      summary: Delete a track
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "204":
          description: The track was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tracks/{id}/stream:
    get:
      operationId: getTrackStream
      summary: Get a stream URL
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: A presigned URL for the audio.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tracks/{id}/status:
    get:
      operationId: getTrackStatus
      summary: Get processing status
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: The processing status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    $ref: "#/components/schemas/TrackStatus"
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /search:
    get:
      operationId: searchTracks
      summary: Search tracks
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: artist
          in: query
          schema:
            type: string
        - name: genre
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
        - name: bpm_min
          in: query
          schema:
            type: number
        - name: bpm_max
          in: query
          schema:
            type: number
        - name: energy_min
          in: query
          schema:
            type: number
        - name: energy_max
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Matching ready tracks, sorted by title.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Track"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /artists:
    get:
      operationId: listArtists
      summary: List artists
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All artists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artist"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /artists/{id}:
    get:
      operationId: getArtist
      summary: Get an artist
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/artistId"
      responses:
        "200":
          description: The artist.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Artist"
                  - type: object
                    properties:
                      album_count:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /artists/{id}/tracks:
    get:
      operationId: listArtistTracks
      summary: List an artist's tracks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/artistId"
      responses:
        "200":
          description: The artist's ready tracks, sorted by title.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Track"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /artists/{id}/albums:
    get:
      operationId: listArtistAlbums
      summary: List an artist's albums
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/artistId"
      responses:
        "200":
          description: The artist's albums, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Album"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /albums:
    get:
      operationId: listAlbums
      summary: List albums
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All albums.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Album"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /albums/{id}:
    get:
      operationId: getAlbum
      summary: Get an album
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: The album.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /albums/{id}/tracks:
    get:
      operationId: listAlbumTracks
      summary: List an album's tracks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: The album's ready tracks, in track order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Track"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /genres:
    get:
      operationId: listGenres
      summary: List genres
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Genres with their ready-track counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/NameCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tags:
    get:
      operationId: listTags
      summary: List tags
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tags with their ready-track counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/NameCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tracks/{id}/tags:
    post:
      operationId: addTrackTags
      summary: Add tags to a track
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/trackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ tags ]
              properties:
                tags:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    maxLength: 32
                    example: workout
      responses:
        "200":
          description: The updated track.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tracks/{id}/tags/{tag}:
    delete:
      operationId: removeTrackTag
      summary: Remove a tag from a track
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/trackId"
        - name: tag
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The tag was removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /playlists:
    post:
      operationId: createPlaylist
      summary: Create a playlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name ]
              properties:
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
                track_ids:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: The new playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: listPlaylists
      summary: List playlists
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Playlists, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlaylistSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /playlists/{id}:
    get:
      operationId: getPlaylist
      summary: Get a playlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/playlistId"
      responses:
        "200":
          description: The playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePlaylist
      summary: Update a playlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/playlistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: The updated playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePlaylist
      summary: Delete a playlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/playlistId"
      responses:
        "204":
          description: The playlist was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /playlists/{id}/tracks:
    get:
      operationId: listPlaylistTracks
      summary: List a playlist's tracks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/playlistId"
      responses:
        "200":
          description: The tracks, in play order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Track"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addPlaylistTracks
      summary: Add tracks to a playlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/playlistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ track_ids ]
              properties:
                track_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                position:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: The updated playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /playlists/{id}/tracks/order:
    put:
      operationId: reorderPlaylistTracks
      summary: Reorder a playlist's tracks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/playlistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ track_ids ]
              properties:
                track_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: The updated playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /playlists/{id}/tracks/{trackId}:
    delete:
      operationId: removePlaylistTrack
      summary: Remove a track from a playlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/playlistId"
        - name: trackId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The track was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /playlists/{id}/player:
    post:
      operationId: createPlaylistPlayer
      summary: Create a playlist player link
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/playlistId"
      responses:
        "201":
          description: A temporary link to a page that plays the playlist.
          content:
            application/json:
              schema:
                type: object
                required: [ url, expires_at ]
                properties:
                  url:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /upload:
    post:
      operationId: uploadAudio
      summary: Upload audio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The id of the new audio.
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The file is larger than 4500000 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /request:
    get:
      operationId: getAudio
      summary: Get audio by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The audio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audio"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /list:
    get:
      operationId: listAudio
      summary: List audio
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every audio, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Audio"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  responses:
    BadRequest:
      description: Bad request
      content: &a1
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content: *a1
    NotFound:
      description: Not found
      content: *a1
  parameters:
    playlistId:
      name: id
      in: path
      required: true
      schema:
        type: string
    trackId:
      name: id
      in: path
      required: true
      schema:
        type: string
    artistId:
      name: id
      in: path
      required: true
      schema:
        type: string
    albumId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [ bad_request, not_found, payload_too_large, internal ]
            message:
              type: string
    Audio:
      type: object
      properties:
        Id:
          type: string
        Path:
          type: string
        Metadata:
          type: object
          properties:
            tags:
              type: object
              properties:
                title:
                  type: string
                album:
                  type: string
                artist:
                  type: string
                album_artist:
                  type: string
                composer:
                  type: string
                genre:
                  type: string
                year:
                  type: integer
                lyrics:
                  type: string
                comment:
                  type: string
            transcript:
              type: string
        Status:
          type: string
        Error:
          type: array
          items:
            type: string
    TrackStatus:
      type: string
      enum: [ processing, ready, failed ]
    Track:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/TrackStatus"
        error:
          type: string
        title:
          type: string
        artist:
          type: string
        artist_id:
          type: string
        album:
          type: string
        album_id:
          type: string
        track_number:
          type: integer
        album_artist:
          type: string
        composer:
          type: string
        comment:
          type: string
        genre:
          type: string
        year:
          type: integer
        lyrics:
          type: string
        copyright:
          type: string
        bpm:
          type: number
        bpm_source:
          type: string
          enum: [ tag, measured, manual ]
        energy:
          type: number
        duration_seconds:
          type: number
        s3_key:
          type: string
        original_filename:
          type: string
        size_bytes:
          type: integer
          format: int64
        content_sha256:
          type: string
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Artist:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        track_count:
          type: integer
    Album:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist_id:
          type: string
        artist:
          type: string
        year:
          type: integer
        track_count:
          type: integer
    PlaylistSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        track_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Playlist:
      allOf:
        - $ref: "#/components/schemas/PlaylistSummary"
        - type: object
          properties:
            track_ids:
              type: array
              items:
