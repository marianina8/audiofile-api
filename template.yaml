AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: audiofile-api

Parameters:
  IssuerPlaceholder:
    Type: String
    Default: https://issuer.example.com
    Description: JWT issuer URL; replaced by the Cognito user pool reference.
  AudiencePlaceholder:
    Type: String
    Default: placeholder-audience
    Description: JWT audience; replaced by the Cognito app client references.

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Ref IssuerPlaceholder
              audience:
                - !Ref AudiencePlaceholder

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: cmd/api/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      Events:
        GetHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        CreateTrackUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/uploads
            Method: POST
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        ListTracks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        GetTrack:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/{id}
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        UpdateTrack:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/{id}
            Method: PATCH
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        DeleteTrack:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/{id}
            Method: DELETE
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        GetTrackStream:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/{id}/stream
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        GetTrackStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/{id}/status
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
