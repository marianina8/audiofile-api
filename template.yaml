AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: audiofile-api

Parameters:
  IssuerPlaceholder:
    Type: String
    Default: https://issuer.example.com
    Description: JWT issuer URL; replaced by the Cognito user pool reference.
  AudiencePlaceholder:
    Type: String
    Default: placeholder-audience
    Description: JWT audience; replaced by the Cognito app client references.

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Ref IssuerPlaceholder
              audience:
                - !Ref AudiencePlaceholder

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: cmd/api/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      Events:
        GetHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        CreateTrackUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/uploads
            Method: POST
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        ListTracks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        GetTrack:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/{id}
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        UpdateTrack:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/{id}
            Method: PATCH
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        DeleteTrack:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/{id}
            Method: DELETE
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        GetTrackStream:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/{id}/stream
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        GetTrackStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/{id}/status
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        SearchTracks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /search
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        ListArtists:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /artists
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        GetArtist:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /artists/{id}
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        ListArtistTracks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /artists/{id}/tracks
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        ListArtistAlbums:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /artists/{id}/albums
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        ListAlbums:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /albums
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        GetAlbum:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /albums/{id}
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        ListAlbumTracks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /albums/{id}/tracks
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        ListGenres:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /genres
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        ListTags:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tags
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        AddTrackTags:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/{id}/tags
            Method: POST
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        RemoveTrackTag:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tracks/{id}/tags/{tag}
            Method: DELETE
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        CreatePlaylist:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /playlists
            Method: POST
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        ListPlaylists:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /playlists
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        GetPlaylist:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /playlists/{id}
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        UpdatePlaylist:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /playlists/{id}
            Method: PATCH
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        DeletePlaylist:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /playlists/{id}
            Method: DELETE
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        ListPlaylistTracks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /playlists/{id}/tracks
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/read
                - aws.cognito.signin.user.admin
        AddPlaylistTracks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /playlists/{id}/tracks
            Method: POST
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        RemovePlaylistTrack:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /playlists/{id}/tracks/{trackId}
            Method: DELETE
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        ReorderPlaylistTracks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /playlists/{id}/tracks/order
            Method: PUT
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
        CreatePlaylistPlayer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /playlists/{id}/player
            Method: POST
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - audiofile/write
                - aws.cognito.signin.user.admin
